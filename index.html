<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <link rel="icon" type="image/png" href="%_FAVICON_PNG_URL_%?_t=%_VERSION_%" sizes="192x192" />
  <link rel="icon" type="image/svg+xml" href="%_FAVICON_SVG_URL_%?_t=%_VERSION_%" />
  <link rel="shortcut icon" href="%_FAVICON_ICO_URL_%?_t=%_VERSION_%" />
  <link rel="apple-touch-icon" sizes="180x180" href="%_FAVICON_APPLE_URL_%?_t=%_VERSION_%" />
  <link rel="preload" href="%BASE_URL%fonts/font.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="%BASE_URL%fonts/font.css" /></noscript>
  <!-- t110774 §3.7 / PR7: 提前 preload woff2 字体，避免 CSS 加载完才发起字体请求（FOUT）-->
  <link rel="preload" href="%BASE_URL%fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link rel="preload" href="%BASE_URL%fonts/tektur-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">
  <meta name="orientation" content="portrait">
  <meta name="theme-color" content="%_PWA_THEME_COLOR_%" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="%_PWA_THEME_COLOR_%" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-status-bar-style" content="%_PWA_STATUS_BAR_STYLE_%">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-TileColor" content="%_PWA_THEME_COLOR_%">
  <meta name="msapplication-navbutton-color" content="%_PWA_THEME_COLOR_%">
  <meta name="mobile-web-app-capable" content="yes">
  <title>%_SEO_TITLE_%</title>
  <meta name="description" content="%_SEO_DESCRIPTION_%" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%_WEBSITE_URL_%" />
  <meta property="og:title" content="%_SEO_OG_TITLE_%" />
  <meta property="og:description" content="%_SEO_OG_DESCRIPTION_%" />
  <meta property="og:image" content="%_SEO_OG_IMAGE_%" />
  <meta property="og:image:width" content="%_SEO_OG_IMAGE_WIDTH_%" />
  <meta property="og:image:height" content="%_SEO_OG_IMAGE_HEIGHT_%" />
  <meta property="og:site_name" content="%_SEO_OG_SITE_NAME_%" />
  <link rel="preload" href="%BASE_URL%scripts/loader.js" as="script" />
  <link rel="stylesheet" href="%BASE_URL%styles/loader.css">
</head>
<body>
<script src="%BASE_URL%scripts/loader.js" defer></script>
<!-- Initial loading screen -->
<div id="initial-loader"><div class="loader-logo"><img src="%_LOGO_LOADER_URL_%" alt=""></div></div>
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
